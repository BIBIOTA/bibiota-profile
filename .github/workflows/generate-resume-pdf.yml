name: Build and Deploy

on:
  push:
    branches: [master, main]
    paths:
      - 'docs/.vitepress/theme/components/PersonalData.js'
      - 'docs/.vitepress/theme/components/ResumeTemplate.vue'
      - 'docs/.vitepress/theme/components/ResumeLayout.vue'
      - 'docs/.vitepress/theme/components/FinalResume.vue'
      - 'scripts/generate-resume-pdfs.js'
      - '.github/workflows/generate-resume-pdf.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build site and generate PDFs
        run: bash scripts/build-with-pdfs.sh

      - name: Prepare Vercel prebuilt output
        run: |
          mkdir -p .vercel/output/static
          cp -r docs/.vitepress/dist/* .vercel/output/static/
          echo '{"version": 3}' > .vercel/output/config.json

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
